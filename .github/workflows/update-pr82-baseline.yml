name: Update PR 82 baseline

on:
  push:
    branches:
      - ci/audit-diagnose

permissions:
  contents: write

jobs:
  merge-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authority branch
        uses: actions/checkout@v4
        with:
          ref: lane-b/w0-c-level1-authority-core
          fetch-depth: 0
      - name: Merge current master into PR 82 branch
        shell: bash
        run: |
          set -euo pipefail
          expected_head="24fee83af5b786565f5a11557f48398e09313eab"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
          git config user.name "Alajmah"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git fetch origin master
          git merge --no-ff origin/master -m $'chore(authority): merge current master baseline\n\nSigned-off-by: Alajmah <55954113+Alajmah@users.noreply.github.com>'
          changed="$(git diff --name-only origin/master...HEAD)"
          expected=$'docs/architecture/authority/README.md\ndocs/architecture/authority/current-state-inventory.md\ndocs/architecture/authority/level-1-core.md\ndocs/architecture/authority/permission-model.md'
          test "$changed" = "$expected"
          git push origin HEAD:lane-b/w0-c-level1-authority-core
