name: W2 Configuration Layering

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/rules/src/**'
      - 'packages/rules/tests/**'
      - 'packages/web/src/services/configService.js'
      - 'packages/web/src/services/policyDiffService.js'
      - 'packages/web/src/services/policySimulationService.js'
      - 'packages/web/src/services/policyRecommendationService.js'
      - 'packages/web/src/routes/config.js'
      - 'packages/web-dashboard/src/app/config/page.tsx'
      - 'packages/web/tests/integration/w2-04-config-layering-db.mjs'
      - 'packages/web/tests/unit/w2-04-config-layering.test.js'
      - '.github/workflows/w2-configuration-layering.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/rules/src/**'
      - 'packages/rules/tests/**'
      - 'packages/web/src/services/configService.js'
      - 'packages/web/src/services/policyDiffService.js'
      - 'packages/web/src/services/policySimulationService.js'
      - 'packages/web/src/services/policyRecommendationService.js'
      - 'packages/web/src/routes/config.js'
      - 'packages/web-dashboard/src/app/config/page.tsx'
      - 'packages/web/tests/integration/w2-04-config-layering-db.mjs'
      - 'packages/web/tests/unit/w2-04-config-layering.test.js'
      - '.github/workflows/w2-configuration-layering.yml'

permissions:
  contents: read

jobs:
  w2-configuration-layering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitwire
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gitops_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitwire -d gitops_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gitwire:test@127.0.0.1:5432/gitops_hub
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply repository migrations
        run: node scripts/migrate.js
      - name: Prove W2-04 resolver semantics (sparse layering, provenance, vectors, safe defaults)
        run: cd packages/rules && NODE_OPTIONS="--experimental-vm-modules" npx jest tests/resolve.test.js tests/parse.test.js tests/helpers.test.js --no-coverage --runInBand
      - name: Prove W2-04 service wiring (identity, cache coherence, compatibility)
        run: cd packages/web && NODE_OPTIONS="--experimental-vm-modules" npx jest tests/unit/w2-04-config-layering.test.js --config jest.config.js --runInBand --no-coverage
      - name: Prove W2-04 governed-layer identity against real PostgreSQL
        run: node packages/web/tests/integration/w2-04-config-layering-db.mjs
