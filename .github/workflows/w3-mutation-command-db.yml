name: W3 Mutation Command DB

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/web/db/migrations/048_w3_mutation_commands.sql'
      - 'packages/web/db/rollbacks/048_w3_mutation_commands.rollback.sql'
      - 'packages/web/src/services/mutationCommandService.js'
      - 'packages/web/src/services/auth/decisionLog.js'
      - 'packages/web/src/services/auth/authorize.js'
      - 'packages/web/tests/integration/w3-01-mutation-commands-db.mjs'
      - 'packages/web/tests/unit/w3-01-mutation-commands.test.js'
      - 'packages/web/db/migrations/049_w3_command_lifecycle.sql'
      - 'packages/web/db/rollbacks/049_w3_command_lifecycle.rollback.sql'
      - 'packages/web/src/services/mutationLifecycleService.js'
      - 'packages/web/tests/integration/w3-02-command-lifecycle-db.mjs'
      - 'packages/web/tests/integration/w3-02-historical-seed-db.mjs'
      - 'packages/web/tests/integration/w3-02-historical-verify-db.mjs'
      - 'packages/web/tests/integration/w3-02-rollback-verify-db.mjs'
      - 'packages/web/tests/integration/w3-02-reapply-verify-db.mjs'
      - 'packages/web/tests/unit/w3-02-command-lifecycle.test.js'
      - '.github/workflows/w3-mutation-command-db.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/web/db/migrations/048_w3_mutation_commands.sql'
      - 'packages/web/db/rollbacks/048_w3_mutation_commands.rollback.sql'
      - 'packages/web/src/services/mutationCommandService.js'
      - 'packages/web/src/services/auth/decisionLog.js'
      - 'packages/web/src/services/auth/authorize.js'
      - 'packages/web/tests/integration/w3-01-mutation-commands-db.mjs'
      - 'packages/web/tests/unit/w3-01-mutation-commands.test.js'
      - 'packages/web/db/migrations/049_w3_command_lifecycle.sql'
      - 'packages/web/db/rollbacks/049_w3_command_lifecycle.rollback.sql'
      - 'packages/web/src/services/mutationLifecycleService.js'
      - 'packages/web/tests/integration/w3-02-command-lifecycle-db.mjs'
      - 'packages/web/tests/integration/w3-02-historical-seed-db.mjs'
      - 'packages/web/tests/integration/w3-02-historical-verify-db.mjs'
      - 'packages/web/tests/integration/w3-02-rollback-verify-db.mjs'
      - 'packages/web/tests/integration/w3-02-reapply-verify-db.mjs'
      - 'packages/web/tests/unit/w3-02-command-lifecycle.test.js'
      - '.github/workflows/w3-mutation-command-db.yml'

permissions:
  contents: read

jobs:
  w3-mutation-command-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitwire
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gitops_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitwire -d gitops_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gitwire:test@127.0.0.1:5432/gitops_hub
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Gate groups 1–17 (migration, placement, hashing, evidence linkage and
      # failure atomicity, replay/conflict incl. diagnostics, concurrency,
      # single-event, ordering, orphan/duplicate rejection, immutability,
      # W2-04 identity capture, attribution) + group 21 partial (source
      # contracts) + group 22 (scope boundary).
      # Historical upgrade proof FIRST (A20): two-stage on the main proof
      # database — apply 001-048, seed two commands on the 048 schema, then
      # apply 049 and verify deterministic initialization. (A separate
      # database is impossible here: Level-1 roles are cluster-global and
      # migration 039 refuses to adopt pre-existing ones.)
      - name: Two-stage migration (001-048, seed, 049)
        run: |
          set -e
          mkdir -p /tmp/w3hist
          mv packages/web/db/migrations/049_w3_command_lifecycle.sql /tmp/w3hist/
          node scripts/migrate.js
          node packages/web/tests/integration/w3-02-historical-seed-db.mjs
          mv /tmp/w3hist/049_w3_command_lifecycle.sql packages/web/db/migrations/
          node scripts/migrate.js
      - name: Verify historical initialization (version 1 / created / empty journal)
        run: node packages/web/tests/integration/w3-02-historical-verify-db.mjs
      - name: Prove W3-01 unit contracts (groups 17, 22)
        run: cd packages/web && NODE_OPTIONS="--experimental-vm-modules" npx jest tests/unit/w3-01-mutation-commands.test.js --config jest.config.js --runInBand --no-coverage
      - name: Prove W3-01 against real PostgreSQL (groups 2-16)
        run: node packages/web/tests/integration/w3-01-mutation-commands-db.mjs

      # W3-02 lifecycle proofs: claim-then-advance CAS, guards, journal
      # coupling, concurrency, append-only journal, raw-SQL boundary.
      - name: Prove W3-02 unit contracts
        run: cd packages/web && NODE_OPTIONS="--experimental-vm-modules" npx jest tests/unit/w3-02-command-lifecycle.test.js --config jest.config.js --runInBand --no-coverage
      - name: Prove W3-02 claim-then-advance against real PostgreSQL
        run: node packages/web/tests/integration/w3-02-command-lifecycle-db.mjs

      # Rollback cycle: 049 first (restores the exact 048 trigger), then 048,
      # then reapply both and verify both schema identities. Sequence runtime
      # values are excluded from identity by contract.
      - name: Rollback 049 and verify exact 048-trigger restoration
        run: node packages/web/tests/integration/w3-02-rollback-verify-db.mjs
      - name: Rollback 048 and verify pre-W3-01 schema preservation
        run: node packages/web/tests/integration/w3-01-rollback-verify-db.mjs
      - name: Forward reapply (048 + 049)
        run: node scripts/migrate.js
      - name: Verify 048 schema-identity restoration
        run: node packages/web/tests/integration/w3-01-reapply-verify-db.mjs
      - name: Verify 049 schema-identity restoration
        run: node packages/web/tests/integration/w3-02-reapply-verify-db.mjs

      # Gate group 21 (existing machinery regression): the aggregate CI
      # workflow runs the complete existing suite (managed_actions, review,
      # triage, merge queue, repair) on this same head; this workflow's unit
      # step above additionally proves no writer cutover occurred.
