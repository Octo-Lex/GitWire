name: Build final security lockfile

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'ci/audit-diagnose'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate clean signed fix commit
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --omit=dev --json > /tmp/audit.json || true
          node scripts/enforce-production-audit.mjs /tmp/audit.json audit-exceptions.json
          rm .github/workflows/audit-diagnose.yml
          git fetch origin master
          git reset --soft origin/master
          git add -A
          git config user.name 'Alajmah'
          git config user.email '55954113+Alajmah@users.noreply.github.com'
          git commit -s -m 'security(deps): resolve July 2026 production audit findings'
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
