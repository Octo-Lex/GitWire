name: Audit diagnose

on:
  push:
    branches: [ci/audit-diagnose]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Capture audit diagnosis
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/production-audit.json 2>/tmp/audit-stderr.log
          AUDIT_EXIT=$?
          node scripts/enforce-production-audit.mjs /tmp/production-audit.json audit-exceptions.json > /tmp/evaluator.log 2>&1
          EVALUATOR_EXIT=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/production-audit.json', 'utf8'));
          const blocking = Object.fromEntries(Object.entries(report.vulnerabilities || {}).filter(([,v]) => ['high','critical'].includes(v.severity)));
          fs.writeFileSync('/tmp/diagnosis.json', JSON.stringify({
            audit_exit: Number(process.env.AUDIT_EXIT || -1),
            evaluator_exit: Number(process.env.EVALUATOR_EXIT || -1),
            metadata: report.metadata,
            blocking
          }, null, 2));
          NODE
          printf 'AUDIT_EXIT=%s\nEVALUATOR_EXIT=%s\n' "$AUDIT_EXIT" "$EVALUATOR_EXIT" > /tmp/exit-codes.txt
          cat /tmp/evaluator.log
          cat /tmp/diagnosis.json
        env:
          AUDIT_EXIT: '0'
          EVALUATOR_EXIT: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-diagnosis
          path: |
            /tmp/production-audit.json
            /tmp/evaluator.log
            /tmp/diagnosis.json
            /tmp/exit-codes.txt
            /tmp/audit-stderr.log
          if-no-files-found: error
          retention-days: 1
